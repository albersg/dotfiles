name: E2E Installer Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run Go tests
        run: go test ./... -skip Golden

  linux-e2e:
    name: Linux E2E (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: go-tests
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu, debian, fedora, alpine]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run Docker E2E
        env:
          # The revision under test, so the installer inside the container clones
          # the code being tested rather than the default branch. It is empty for
          # a push and for a pull request from a fork, because a fork's branch
          # does not exist in this repository and the clone would fail; those runs
          # keep testing the default branch, which is the old behaviour.
          DOTFILES_REPO_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
        run: ./installer/e2e/docker-test.sh e2e ${{ matrix.image }}

  termux-e2e:
    name: Termux E2E (non-blocking)
    runs-on: ubuntu-latest
    needs: go-tests
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run Termux Docker E2E
        env:
          DOTFILES_REPO_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
        run: ./installer/e2e/docker-test.sh e2e termux

  macos-smoke:
    name: macOS smoke test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run Go tests including golden snapshots
        run: go test ./...

      - name: Build installer
        run: go build ./cmd/dotfiles

      - name: Run non-interactive help smoke test
        run: ./dotfiles --help
