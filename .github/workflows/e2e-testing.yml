name: E2E Installer Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. A superseded push cancels the run it replaced: three
# pushes on one branch used to pay this matrix three times over.
#
# A push to main is never cancelled. The group is the same for every push to
# main, so `cancel-in-progress: true` was killing the previous commit's matrix
# as soon as the next merge arrived: run 36586936998 has `Linux E2E (ubuntu)`
# cancelled at 15:09:32, five seconds after the next push created run
# 36588029818, and that commit's only full apt-and-Homebrew installation was
# never verified by anything. Waiting behind the previous run costs minutes;
# abandoning a merged commit's check costs the check.
concurrency:
  group: e2e-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which images this event runs is a coverage decision, and it is written here,
  # in plain shell, rather than inside an expression that only GitHub evaluates.
  #
  # A pull request runs one image per package manager and shell family. debian is
  # the image a pull request drops, and only it: it is the second apt-family
  # image, and the installer classifies Ubuntu and Debian alike as `OSDebian`
  # (internal/system/detect.go, decided by /etc/debian_version), so ubuntu walks
  # the same package list and the same 240-combination dry-run planning matrix
  # through the same binary - and then installs for real, which debian never
  # does. Debian's own thirteen assertions are three binary smoke tests (also run
  # on ubuntu, fedora, arch and alpine), three option-planning tests (also run on
  # ubuntu) and the dry-run matrix (also run on ubuntu, same OSDebian path). Its
  # only remaining difference is that e2e_test.sh itself runs under `sh` (dash)
  # rather than bash, and alpine covers that on a pull request under busybox
  # `ash`, a stricter POSIX shell. It returns on main, where a second apt
  # generation is worth a 36-second job.
  #
  # Nothing else goes. fedora is the only dnf execution, arch the only pacman
  # execution, alpine the only apk detection and the only non-bash shell left on
  # a pull request, and termux the only Android/Termux detection. Cutting any of
  # them would be the false safety of a matrix that looks green over a path
  # nobody exercised.
  e2e-images:
    name: E2E image list
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Decide which images this event runs
        id: images
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'images=["ubuntu","fedora","arch","alpine"]' >> "$GITHUB_OUTPUT"
          else
            echo 'images=["ubuntu","debian","fedora","arch","alpine"]' >> "$GITHUB_OUTPUT"
          fi

  go-tests:
    name: Go tests
    # `go test ./... -skip Golden` also runs inside Go Validation in ci.yml, on
    # the same runner with the same toolchain, so this job is a duplicate by
    # command. It stays because it is the only place a test failure is reported
    # without a gofmt failure in front of it - Go Validation stops at gofmt and
    # never reaches its test step - and because the parallel run costs no
    # pull-request feedback time at all: this job takes 47 seconds while the
    # Ubuntu image takes 424. The duplication is deliberate, and the reason to
    # merge them is a leftover worth one check, not this one.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run Go tests
        run: go test ./... -skip Golden

  linux-e2e:
    name: Linux E2E (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Only the image list. The gate that used to sit here, `needs: go-tests`, was
    # worth removing: this job builds the binary from its own checkout and runs it
    # in Docker, so it consumes nothing the Go tests produce, and waiting for a
    # 47-second job before starting a 424-second one cost the pull request 50
    # seconds (run 36625550831: Go tests 20:19:41-20:20:28, this matrix starting
    # at 20:20:31). It also corrupted the check list - a failing `Go tests`
    # skipped this matrix and listed it as `Linux E2E (${{ matrix.image }})`, an
    # unexpanded name for a matrix that never ran.
    needs: e2e-images
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.e2e-images.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run Docker E2E
        env:
          # The revision under test, so the installer inside the container clones
          # the code being tested rather than the default branch. It is empty for
          # a push and for a pull request from a fork, because a fork's branch
          # does not exist in this repository and the clone would fail; those runs
          # keep testing the default branch, which is the old behaviour.
          DOTFILES_REPO_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
        run: ./installer/e2e/docker-test.sh e2e ${{ matrix.image }}

  termux-e2e:
    name: Termux E2E (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    # No `needs: go-tests`, for the same reason as the Linux matrix: nothing
    # here reads the Go tests' output, and the dependency only serialised it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run Termux Docker E2E
        env:
          DOTFILES_REPO_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
        run: ./installer/e2e/docker-test.sh e2e termux

  macos-smoke:
    name: macOS smoke test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Run Go tests including golden snapshots
        run: go test ./...

      - name: Build installer
        run: go build ./cmd/dotfiles

      - name: Run non-interactive help smoke test
        run: ./dotfiles --help
