name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            artifact: dotfiles-darwin-arm64
          - goos: darwin
            goarch: amd64
            artifact: dotfiles-darwin-amd64
          - goos: linux
            goarch: arm64
            artifact: dotfiles-linux-arm64
          - goos: linux
            goarch: amd64
            artifact: dotfiles-linux-amd64
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "${{ matrix.artifact }}" \
            ./cmd/dotfiles

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer/${{ matrix.artifact }}

  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f -name 'dotfiles-*' | while read -r f; do
            sha256sum "$f" >> ../SHA256SUMS
          done
          cat ../SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS

  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: checksums
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets
        run: |
          mkdir -p dist
          find release-assets -type f -name 'dotfiles-*' | while read -r f; do
            cp "$f" dist/
          done
          cp release-assets/SHA256SUMS/SHA256SUMS dist/
          ls -la dist/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
