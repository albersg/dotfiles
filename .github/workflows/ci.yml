name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Before this, a branch with three pushes paid this
# workflow's whole job set three times over and the two older runs were read by
# nobody. A superseded push now cancels the run it replaced.
#
# A push to main is never cancelled. On main the run is the verdict on a commit
# that is already merged, so cancelling it leaves that commit verified by
# nobody; with the cancel turned off the next run waits its turn instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-validate:
    name: Go Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -skip Golden -count=1

  shell-validate:
    name: Shell Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        # The runner image already carries shellcheck, and the unguarded
        # `apt-get update` was fetching 12.5 MB of package indexes to answer
        # "shellcheck is already the newest version (0.9.0-1)" - six of this
        # job's fifteen seconds, spent to learn nothing was missing (Shell
        # Validation, run 36625550800). The guard keeps the install for an image
        # that lacks it, so the check runs everywhere and still costs nothing
        # when there is nothing to install.
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: Run shellcheck
        run: |
          find . -name '*.sh' -type f \
            ! -path './dotfiles-zsh/.oh-my-zsh/*' \
            ! -path './.git/*' \
            -exec shellcheck --severity=warning {} +

  branding-audit:
    name: Branding Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        # Same guard, same reason: ubuntu-latest ships ripgrep and the apt run
        # only reported that it was already present (Branding Audit, run
        # 36625550800). Install it when the image does not have it.
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Check for residual upstream branding
        run: |
          echo "Checking for residual 'gentleman' or 'GENTLEMAN' strings..."
          echo "Excluding only attribution and traceability records (NOTICE, LICENSE, docs/adr/, docs/ATTRIBUTION.md, THIRD_PARTY_NOTICES.md, DOWNSTREAM.md, UPSTREAM.md, CHANGELOG.md, docs/UPSTREAM-SYNC.md, docs/BRANDING.md, docs/audits/*), the upstream watcher, go.sum, .gitignore, the en_US spell dictionary, and Brewfile."
          echo "Brewfile is excluded because it records installed CLI tools published by a third party; those Go module paths are canonical package identifiers, not branding."
          matches=$(rg -l -i 'gentleman' \
            --glob '!NOTICE' \
            --glob '!docs/adr/*' \
            --glob '!docs/ATTRIBUTION.md' \
            --glob '!CHANGELOG.md' \
            --glob '!DOWNSTREAM.md' \
            --glob '!UPSTREAM.md' \
            --glob '!LICENSE' \
            --glob '!.git/*' \
            --glob '!THIRD_PARTY_NOTICES.md' \
            --glob '!docs/UPSTREAM-SYNC.md' \
            --glob '!docs/audits/*' \
            --glob '!docs/BRANDING.md' \
            --glob '!go.sum' \
            --glob '!Brewfile' \
            --glob '!dotfiles-nvim/nvim/spell/*' \
            --glob '!.github/workflows/upstream-watch.yml' \
            --glob '!.gitignore' \
            . 2>/dev/null || true)

          if [ -n "$matches" ]; then
            echo "ERROR: Residual upstream branding found in:"
            echo "$matches"
            echo ""
            echo "Detailed matches:"
            rg -n -i 'gentleman' \
              --glob '!NOTICE' \
              --glob '!docs/adr/*' \
              --glob '!docs/ATTRIBUTION.md' \
              --glob '!CHANGELOG.md' \
              --glob '!DOWNSTREAM.md' \
              --glob '!UPSTREAM.md' \
              --glob '!LICENSE' \
              --glob '!.git/*' \
              --glob '!THIRD_PARTY_NOTICES.md' \
              --glob '!docs/UPSTREAM-SYNC.md' \
              --glob '!docs/audits/*' \
              --glob '!docs/BRANDING.md' \
              --glob '!go.sum' \
              --glob '!Brewfile' \
              --glob '!dotfiles-nvim/nvim/spell/*' \
              --glob '!.github/workflows/upstream-watch.yml' \
              --glob '!.gitignore' \
              . 2>/dev/null || true
            exit 1
          fi
          echo "Branding audit passed"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # No `needs`. Nothing here consumes the output of go-validate or
    # branding-audit, so the dependency only serialised the build behind them - and
    # it corrupted the check list: when either of those failed, GitHub skipped
    # this matrix job and listed it as `Build (${{ matrix.os }})`, an unexpanded
    # name for a job that never ran (run 36559187850 shows it beside the failing
    # Branding Audit). Starting the build immediately is both honest and faster.
    strategy:
      # One OS failing must not cancel the other, or its check reads as
      # cancelled and nobody learns whether that platform builds.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Build
        run: go build -o dotfiles ./cmd/dotfiles

      - name: Smoke test
        run: ./dotfiles --help
