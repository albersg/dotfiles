format = """\
($directory)\
$os\
$git_branch\
$fill\
$nodejs\
$rust\
$golang\
$php\
$bun\
$java\
$c\
$conda\
$zig\
$cmd_duration\
$time\
\n$character\
"""

add_newline = true
command_timeout = 3600000
# dotfiles-managed-config: starship
# >>> dotfiles-theme-palette: dotfiles (generated from themes/dotfiles.toml; edit the definition, not this block) >>>
palette = "dotfiles"
# <<< dotfiles-theme-palette <<<

[fill]
symbol = ' '

# dotfiles-managed-config: starship
# >>> dotfiles-theme-palettes: dotfiles (generated from themes/dotfiles.toml; edit the definition, not this block) >>>
[palettes.dotfiles]
text = "#f3f6f9"
red = "#cb7c94"
green = "#b7cc85"
yellow = "#ffe066"
blue = "#7fb4ca"
mauve = "#a3b5d6"
pink = "#ff8dd7"
teal = "#7aa89f"
peach = "#deba87"
subtext0 = "#5c6170"
overlay0 = "#232a40"
rosewater = "#e0c15a"
flamingo = "#ff8dd7"
maroon = "#c4746e"
lavender = "#b99bf2"
subtext1 = "#8a8fa3"
overlay2 = "#313342"
overlay1 = "#191e28"
surface2 = "#27345c"
surface1 = "#232a40"
surface0 = "#191e28"
base = "none"
mantle = "#06080f"
crust = "#06080f"
# <<< dotfiles-theme-palettes <<<

[character]
success_symbol = "[󱗞 ](fg:green)"
error_symbol = "[󱗞 ](fg:red)"
vimcmd_symbol = "[N](bold red)"
vimcmd_replace_one_symbol = "[R](bold peach)"
vimcmd_visual_symbol = "[V](bold mauve)"

[username]
style_user = 'bold blue'
style_root = 'bold red'
format = '[󱗞 $user](fg:$style) '
disabled = false
show_always = true

[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:blue"
read_only_style = "fg:blue"
before_repo_root_style = "fg:blue"
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "  "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[cmd_duration]
format = " took [ $duration]($style) "
style = "bold fg:yellow"
min_time = 500

[git_branch]
format = "-> [$symbol$branch]($style) "
style = "bold fg:mauve"
symbol = " "

[git_status]
format = '[$all_status$ahead_behind ]($style)'
style = "fg:text bg:pink"

[docker_context]
disabled = true
symbol = " "

[python]
disabled = false
format = "[$symbol$pyenv_prefix($version)( $virtualenv)](fg:peach)"
symbol = " "
version_format = "$raw"

[java]
format = '[[ $symbol ($version) ](fg:red)]($style)'
version_format = "$raw"
symbol = " "
disabled = false

[c]
format = '[[ $symbol ($version) ](fg:blue)]($style)'
symbol = " "
version_format = "$raw"
disabled = false

[zig]
format = '[[ $symbol ($version) ](fg:peach)]($style)'
version_format = "$raw"
disabled = false

[bun]
version_format = "$raw"
format = '[[ $symbol ($version) ](fg:text)]($style)'
disabled = false

[nodejs]
symbol = ""
format = '[[ $symbol ($version) ](fg:green)]($style)'

[rust]
symbol = ""
format = '[[ $symbol ($version) ](fg:red)]($style)'

[golang]
symbol = ""
format = '[[ $symbol ($version) ](fg:teal)]($style)'

[php]
symbol = ""
format = '[[ $symbol ($version) ](fg:peach)]($style)'

[time]
disabled = false
time_format = "%R"
format = '[[   $time ](fg:subtext0)]($style)'
