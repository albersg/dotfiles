onboarding = false
# herdr configuration managed by dotfiles.
# This file is copied into ~/.config/herdr/config.toml during installation.
#
# The installer installs Herdr's plugin set itself, with
# `herdr plugin install <owner>/<repo> --yes`, and verifies it with
# `herdr plugin list`; the set is declared in the installer's source. It never
# uninstalls or disables a plugin, so plugins you add yourself are left as they
# are. Herdr has no plugin update command: re-running the installer updates the
# declared plugins.

[theme]
# A built-in dark theme with neutral foregrounds, so Herdr does not inherit
# Ghostty bright-black selected rows or Kanagawa's warm/yellow label text.
name = "vesper"

auto_switch = false

# dotfiles-managed-config: herdr
# >>> dotfiles-theme: dotfiles (generated from themes/dotfiles.toml; edit the definition, not this block) >>>
# Token overrides on top of that theme, so the chrome Herdr draws agrees with the
# terminal palette (Alacritty, Kitty, WezTerm, Ghostty) and with the zsh prompt,
# which all read the same values from themes/dotfiles.toml.
[theme.custom]
# "reset" is the terminal's own background. Without it Herdr paints its own
# near-black behind every pane, which is a second black sitting next to the
# terminal's.
panel_bg = "reset"
# The value the terminal uses for a text selection, so selecting inside a pane
# and selecting inside the terminal look like the same operation.
selection_bg = "#263356"
# The body text. Herdr exposes four custom tokens and this is the fourth
# (panel_bg, selection_bg, accent and text; herdr config check rejects any
# other name under [theme.custom]), so the custom layer is complete here and the
# [theme] name below stays the built-in base it always was.
text = "#f3f6f9"

[ui]
# Herdr's accent for highlights, borders and navigation UI: the palette's blue,
# the one the zsh prompt already uses for the directory.
accent = "#7fb4ca"
# <<< dotfiles-theme <<<

show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
status_indicators = "symbols"

# Herdr asks for a tab name on every new tab by default. Without that prompt a
# tab keeps its automatic label — the directory it was created in, or a number
# when that name is taken — so opening several tabs does not mean dismissing a
# dialog each time. Naming a tab stays available through `prefix+shift+t`
# (`keys.rename_tab`) or `herdr tab rename`.
prompt_new_tab_name = false

[ui.sound]
# Play a short mp3 alert when an agent finishes or needs input in a background
# workspace. Herdr ships no audio decoder: it shells out to an external mp3
# player, trying `paplay`, `pw-play`, `ffplay`, `mpg123` and `mpv` in that order,
# and fails silently when none of them is installed. The installer provisions
# `mpg123` when none of the five resolves and reports it when even that cannot be
# provided, so this setting is backed by the dependency it needs.
enabled = true

# Sound fires only for agents in a BACKGROUND workspace: an agent in the focused
# workspace never alerts, by design. To test playback manually, run
# `herdr notification show "test" --sound done`; if it stays silent, look for
# `WARN herdr::sound` in ~/.config/herdr/herdr-client.log.

[keys]
# Match tmux/Zellij-style prefix muscle memory.
prefix = "ctrl+a"

# Move between agents in the sidebar.
# Avoid Herdr's built-in prefix+shift+j/k pane-swap bindings.
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Jump straight to agent N (1..9) as listed in the sidebar.
# Use Ctrl after the prefix: Alt+number is owned by skhd/yabai spaces,
# and Shift+number did not reach Herdr reliably in the current terminal setup.
focus_agent = "prefix+ctrl+1..9"

[ui.toast]
delivery = "system"

