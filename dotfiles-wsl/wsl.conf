[boot]
systemd=true

# WSL dispatches PE files to /init through a binfmt_misc entry named WSLInterop.
# Installing another binfmt manager removes that entry, and WSL then re-registers
# it late, as WSLInterop-late, with fewer flags. Windows binaries kept under /mnt/c
# still run in that state, so nothing looks wrong, but the same binary copied onto
# the Linux filesystem fails with "Invalid argument". That is what breaks a
# win32yank.exe installed under ~/.local/bin, and it silently breaks any Windows
# tool kept on the Linux side.
#
# This restores the canonical entry on every boot and does nothing when it is
# already present, so it is idempotent. WSL runs this as root before the user is
# logged in.
command = /bin/sh -c "if [ ! -e /proc/sys/fs/binfmt_misc/WSLInterop ]; then echo ':WSLInterop:M::MZ::/init:PF' > /proc/sys/fs/binfmt_misc/register; fi"

[automount]
enabled=true
options="metadata"

[network]
generateHosts = true
generateResolvConf = true

[interop]
enabled=true
appendWindowsPath=true
