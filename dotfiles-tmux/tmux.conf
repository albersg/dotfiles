# Default shell placeholder (configured by dotfiles installer)
# DOTFILES_DEFAULT_SHELL

# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Tmux Continuum (automatic save/restore; requires tmux-resurrect)
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E -k "tmux new-session -A -s scratch"
}

# Lazygit floating window
bind-key -n M-l display-popup -d "#{pane_current_path}" -E -k "lazygit"

# Tema Kanagawa
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-plugins "git cpu-usage ram-usage"
set -g @kanagawa-ignore-window-colors true

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:hyperlinks"

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -sg escape-time 10

# Modo vim
set -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Status bar position
set -g status-position top

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# Scrollback history per pane (default is only 2000 lines)
set -g history-limit 100000

# TPM init
run '~/.tmux/plugins/tpm/tpm'

# dotfiles-managed-config: tmux
# >>> dotfiles-theme: dotfiles (generated from themes/dotfiles.toml; edit the definition, not this block) >>>
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                DOTFILES THEME                                │
# └──────────────────────────────────────────────────────────────────────────────┘
# tmux's own style options, painted from themes/dotfiles.toml. tmux's theme in this
# repository used to be only the kanagawa plugin's name, and Kanagawa is partial,
# so this is the palette applied to tmux itself rather than a second theme.
# It sits after the TPM run line on purpose: tmux runs run-shell
# synchronously, so the plugins TPM sources have already written their styles
# when this block is read, and these options win.
set -g status-style "fg=#f3f6f9,bg=#06080f"
set -g status-left-style "fg=#06080f,bg=#7fb4ca,bold"
set -g status-right-style "fg=#8a8fa3,bg=#06080f"
set -g message-style "fg=#06080f,bg=#ffe066"
set -g message-command-style "fg=#06080f,bg=#ffe066"
setw -g window-status-style "fg=#8a8fa3,bg=#06080f"
setw -g window-status-current-style "fg=#06080f,bg=#7fb4ca,bold"
setw -g window-status-activity-style "fg=#ffe066,bg=#06080f"
setw -g window-status-bell-style "fg=#cb7c94,bg=#06080f"
setw -g window-status-last-style "fg=#b7cc85,bg=#06080f"
setw -g pane-border-style "fg=#8a8fa3"
setw -g pane-active-border-style "fg=#7fb4ca"
setw -g copy-mode-match-style "fg=#f3f6f9,bg=#263356"
setw -g copy-mode-current-match-style "fg=#06080f,bg=#ffe066"
set -g mode-style "fg=#f3f6f9,bg=#263356"
set -g display-panes-colour "#8a8fa3"
set -g display-panes-active-colour "#7fb4ca"
set -g clock-mode-colour "#7fb4ca"
# <<< dotfiles-theme <<<
