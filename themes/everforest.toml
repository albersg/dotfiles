# Everforest, transcribed from the published palette of sainnhe/everforest.
#
# The repository has held one Everforest file since before the theme library
# existed:
#
#   dotfiles-fish/fish/themes/Everforest.theme   eight fish roles
#
# No terminal, prompt, bat or herdr Everforest palette was in it, which is why
# the theme was partial. The twenty-two canonical roles below are a transcription
# of the published Everforest "dark, medium" palette and the terminal mapping
# that ships with it; every value is a named palette colour of that theme. The
# fish roles the repository already held are kept verbatim.
#
# Source: sainnhe/everforest - https://github.com/sainnhe/everforest
#
#   base      bg0   #2d353b    cursor       fg    #d3c6aa
#   text      fg    #d3c6aa    cursor_text  bg0   #2d353b
#   selection bg3   #475258    selection_text fg  #d3c6aa
#
#   normal      black bg3 #475258   red red #e67e80   green green #a7c080
#               yellow yellow #dbbc7f   blue blue #7fbbb3
#               magenta purple #d699b6   cyan aqua #83c092   white fg #d3c6aa
#   bright      black grey0 #7a8478   red red #e67e80   green green #a7c080
#               yellow yellow #dbbc7f   blue blue #7fbbb3
#               magenta purple #d699b6   cyan aqua #83c092   white fg #d3c6aa
#
# Everforest ships hard, medium and soft backgrounds. The repository's fish file
# is the medium dark variant (fg #d3c6aa), so the definition is that one.

[theme]
id = "everforest"
name = "Everforest"
provenance = "sainnhe/everforest (dark medium palette and its terminal mapping); fish roles from dotfiles-fish/fish/themes/Everforest.theme"

[palette]
# --- terminal base ---
base = "#2d353b"            # bg0, the dark medium background
text = "#d3c6aa"            # fg, the dark medium foreground
cursor = "#d3c6aa"          # fg, the cursor
cursor_text = "#2d353b"     # bg0 under the cursor
selection = "#475258"       # bg3, the selection background
selection_text = "#d3c6aa"  # fg on a selection

# --- ANSI normal (colours 0-7) ---
black = "#475258"           # bg3
red = "#e67e80"             # red
green = "#a7c080"           # green
yellow = "#dbbc7f"          # yellow
blue = "#7fbbb3"            # blue
magenta = "#d699b6"         # purple
cyan = "#83c092"            # aqua
white = "#d3c6aa"           # fg

# --- ANSI bright (colours 8-15) ---
bright_black = "#7a8478"    # grey0
bright_red = "#e67e80"      # red
bright_green = "#a7c080"    # green
bright_yellow = "#dbbc7f"   # yellow
bright_blue = "#7fbbb3"     # blue
bright_magenta = "#d699b6"  # purple
bright_cyan = "#83c092"     # aqua
bright_white = "#d3c6aa"    # fg

# --- fish roles ---
# Transcribed verbatim from dotfiles-fish/fish/themes/Everforest.theme.
[fish]
normal = "d3c6aa"
command = "7fbbb3"
keyword = "d699b6"
quote = "dbbc7f"
redirection = "d3c6aa"
end = "e67e80"
error = "e67e80"
param = "7fbbb3"
comment = "859289"
selection = "2d4f67"
search_match = "2d4f67"
operator = "a7c080"
escape = "d699b6"
autosuggestion = "859289"
pager_progress = "859289"
pager_prefix = "7fbbb3"
pager_completion = "d3c6aa"
pager_description = "859289"

# --- Neovim colorscheme name ---
# The repository's Neovim plugin install ships no Everforest colorscheme, so the
# colorscheme is generated from this definition into
# dotfiles-nvim/nvim/colors/everforest.lua and the name below is its file name.
[nvim]
name = "everforest"

# --- bat theme name and file ---
# The name the .tmTheme carries inside itself and the file it ships as. bat
# registers a custom theme under the file's own name and the switch selects it by
# that name, not by this one (measured against bat 0.26.1); the file is generated
# from this definition by the installer's shell step.
[bat]
name = "Everforest"
file = "everforest.tmTheme"

# --- syntax roles ---
# The installer's own code-display tints. The repository holds no Everforest
# syntax convention beyond the fish file, so the two are that file's keyword and
# quote roles: purple #d699b6 for keywords, yellow #dbbc7f for strings. Only the
# dark member is declared, because this repository ships no Everforest light
# flavour; the preview uses the dark value on a light terminal too.
[syntax]
keyword_dark = "#d699b6"
string_dark = "#dbbc7f"
