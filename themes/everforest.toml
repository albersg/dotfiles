# Everforest: a PARTIAL theme, recorded honestly.
#
# The repository holds one Everforest file:
#
#   dotfiles-fish/fish/themes/Everforest.theme   eight fish roles
#
# No terminal, prompt, bat or herdr Everforest palette exists in this
# repository. The eight fish roles are fish's own roles, not the canonical
# terminal roles, so base/text/cursor/selection and the 16 ANSI colours stay
# EMPTY rather than being extrapolated by eye.
#
# themes/README.md names exactly which tools an Everforest switch would leave
# out. With the canonical roles missing the theme is partial and is NOT offered.

[theme]
id = "everforest"
name = "Everforest"
partial = true
partial_reason = "no canonical palette in the repository: only fish roles (dotfiles-fish/fish/themes/Everforest.theme). The 16 ANSI roles and the terminal base/text/cursor/selection roles do not exist here."
provenance = "dotfiles-fish/fish/themes/Everforest.theme (fish roles only)"

[palette]

# --- fish roles ---
# Transcribed from dotfiles-fish/fish/themes/Everforest.theme. Values are
# fish's own role names, which is why they live here rather than in [palette].
[fish]
normal = "d3c6aa"
command = "7fbbb3"
keyword = "d699b6"
quote = "dbbc7f"
redirection = "d3c6aa"
end = "e67e80"
error = "e67e80"
param = "7fbbb3"
comment = "859289"
selection = "2d4f67"
search_match = "2d4f67"
operator = "a7c080"
escape = "d699b6"
autosuggestion = "859289"
pager_progress = "859289"
pager_prefix = "7fbbb3"
pager_completion = "d3c6aa"
pager_description = "859289"
