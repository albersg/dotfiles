# Kanagawa, transcribed from the published palette of rebelot/kanagawa.nvim.
#
# The repository has named this theme in three configs since before the theme
# library existed:
#
#   dotfiles-nvim/nvim/lua/plugins/colorscheme.lua   the plugin rebelot/kanagawa.nvim, theme "wave"
#   dotfiles-tmux/tmux.conf                          the tmux-kanagawa plugin, variant "dragon"
#   dotfiles-fish/fish/themes/Kanagawa.theme         eight fish roles
#
# The twenty-two canonical roles below are a transcription of the published
# Kanagawa palette and the terminal mapping the plugin ships for it. Every value
# is a named palette colour of that theme; nothing is extrapolated. The fish
# roles and the Neovim colorscheme name are the values the repository already
# held, kept verbatim.
#
# Source: rebelot/kanagawa.nvim - https://github.com/rebelot/kanagawa.nvim
#
#   base      sumiInk3      #1f1f28    cursor       oldWhite     #c8c093
#   text      fujiWhite     #dcd7ba    cursor_text  sumiInk3     #1f1f28
#   selection waveBlue2     #2d4f67    selection_text fujiWhite  #dcd7ba
#
#   normal      black sumiInk0 #16161d   red autumnRed #c34043   green autumnGreen #76946a
#               yellow autumnYellow #dca561   blue crystalBlue #7e9cd8
#               magenta oniViolet #957fb8   cyan waveAqua1 #6a9589   white oldWhite #c8c093
#   bright      black fujiGray #727169   red samuraiRed #e82424   green springGreen #98bb6c
#               yellow carpYellow #e6c384   blue springBlue #7fb4ca
#               magenta springViolet1 #938aa9   cyan waveAqua2 #7aa89f   white fujiWhite #dcd7ba
#
# The plugin also ships a "dragon" variant, which the tmux plugin selects; this
# definition is the "wave" palette the fish theme and the nvim plugin use, so a
# switch keeps the two tools agreeing instead of picking one variant over the
# other.

[theme]
id = "kanagawa"
name = "Kanagawa"
provenance = "rebelot/kanagawa.nvim (wave palette and its terminal mapping); fish roles from dotfiles-fish/fish/themes/Kanagawa.theme"

[palette]
# --- terminal base ---
base = "#1f1f28"            # sumiInk3, the wave background
text = "#dcd7ba"            # fujiWhite, the wave foreground
cursor = "#c8c093"          # oldWhite, the cursor
cursor_text = "#1f1f28"     # sumiInk3 under the cursor
selection = "#2d4f67"       # waveBlue2, the selection background
selection_text = "#dcd7ba"  # fujiWhite on a selection

# --- ANSI normal (colours 0-7) ---
black = "#16161d"           # sumiInk0
red = "#c34043"             # autumnRed
green = "#76946a"           # autumnGreen
yellow = "#dca561"          # autumnYellow
blue = "#7e9cd8"            # crystalBlue
magenta = "#957fb8"         # oniViolet
cyan = "#6a9589"            # waveAqua1
white = "#c8c093"           # oldWhite

# --- ANSI bright (colours 8-15) ---
bright_black = "#727169"    # fujiGray
bright_red = "#e82424"      # samuraiRed
bright_green = "#98bb6c"    # springGreen
bright_yellow = "#e6c384"   # carpYellow
bright_blue = "#7fb4ca"     # springBlue
bright_magenta = "#938aa9"  # springViolet1
bright_cyan = "#7aa89f"     # waveAqua2
bright_white = "#dcd7ba"    # fujiWhite

# --- fish roles ---
# Transcribed from dotfiles-fish/fish/themes/Kanagawa.theme, with the two
# malformed values the hand-written file carried corrected:
#   fish_color_selection --background=2D4FG67  ->  2d4f67  ("G" is not a hex digit)
#   fish_pager_color_description 727269        ->  727169
[fish]
normal = "dcd7ba"
command = "7aa89f"
keyword = "d27e99"
quote = "c0a36e"
redirection = "dcd7ba"
end = "ff9e64"
error = "c34043"
param = "957fb8"
comment = "727169"
selection = "2d4f67"
search_match = "2d4f67"
operator = "76946a"
escape = "d27e99"
autosuggestion = "727169"
pager_progress = "727169"
pager_prefix = "7aa89f"
pager_completion = "dcd7ba"
pager_description = "727169"

# --- Neovim colorscheme name ---
[nvim]
name = "kanagawa"

# --- bat theme name and file ---
# The name the .tmTheme carries inside itself and the file it ships as. bat
# registers a custom theme under the file's own name and the switch selects it by
# that name, not by this one (measured against bat 0.26.1); the file is generated
# from this definition by the installer's shell step.
[bat]
name = "Kanagawa"
file = "kanagawa.tmTheme"

# --- syntax roles ---
# The installer's own code-display tints. The repository holds no Kanagawa
# syntax convention beyond the fish file, so the two are that file's keyword and
# quote roles: sakuraPink #d27e99 for keywords, boatYellow2 #c0a36e for strings.
# Only the dark member is declared, because this repository ships no Kanagawa
# light flavour; the preview uses the dark value on a light terminal too.
[syntax]
keyword_dark = "#d27e99"
string_dark = "#c0a36e"
