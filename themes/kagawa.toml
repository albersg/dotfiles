# Kagawa: a PARTIAL theme, and currently a defect, recorded honestly.
#
# The repository holds one Kagawa file:
#
#   dotfiles-fish/fish/themes/Kagawa.theme
#
# It is a copy of the Kanagawa fish theme: byte-for-byte the same values, and
# its own header line even reads "# name: Kanagawa Fish shell theme". It also
# carries the same two malformed values Kanagawa does (see themes/README.md).
# Kagawa therefore holds NO distinct palette of its own.
#
# With no distinct values and no canonical palette, every canonical role is left
# EMPTY. The theme is partial and is NOT offered. This file exists so the
# defect is visible in the definition set rather than hidden in a fish file.

[theme]
id = "kagawa"
name = "Kagawa"
partial = true
partial_reason = "no distinct palette: dotfiles-fish/fish/themes/Kagawa.theme is a copy of Kanagawa.theme (same values, same 'name: Kanagawa' header). No canonical palette exists in the repository."
provenance = "dotfiles-fish/fish/themes/Kagawa.theme (a copy of Kanagawa.theme)"

[palette]

# --- fish roles ---
# Kagawa shares Kanagawa's palette; this is recorded, not hidden. The generated
# file carries its own "Kagawa" header, which is the defect the hand-written file
# had (it said "name: Kanagawa Fish shell theme").
[fish]
normal = "dcd7ba"
command = "7aa89f"
keyword = "d27e99"
quote = "c0a36e"
redirection = "dcd7ba"
end = "ff9e64"
error = "c34043"
param = "957fb8"
comment = "727169"
selection = "2d4f67"
search_match = "2d4f67"
operator = "76946a"
escape = "d27e99"
autosuggestion = "727169"
pager_progress = "727169"
pager_prefix = "7aa89f"
pager_completion = "dcd7ba"
pager_description = "727169"

# --- syntax roles ---
# No syntax colours: this theme has no canonical palette in the repository, so it
# cannot paint the installer's chrome either. Left empty rather than filled in.
[syntax]
